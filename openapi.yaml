openapi: 3.0.3
info:
  title: Class API
  description: A simple CRUD API for managing student records.
  version: 1.0.0
servers:
  - url: /api
    description: Default server
paths:
  /students/:
    get:
      summary: List all students
      description: Returns a JSON array of all student records.
      operationId: listStudents
      tags:
        - students
      responses:
        '200':
          description: A list of students
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Student'
    post:
      summary: Create a student
      description: Creates a new student record and returns the created student.
      operationId: createStudent
      tags:
        - students
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StudentInput'
      responses:
        '201':
          description: Student created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Student'
        '400':
          description: Invalid request data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /students/{id}/:
    get:
      summary: Get a student by ID
      description: Returns a single student record by primary key.
      operationId: getStudent
      tags:
        - students
      parameters:
        - name: id
          in: path
          required: true
          description: Primary key of the student
          schema:
            type: integer
      responses:
        '200':
          description: A single student record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Student'
        '404':
          description: Student not found
    put:
      summary: Update a student
      description: Fully updates an existing student record.
      operationId: updateStudent
      tags:
        - students
      parameters:
        - name: id
          in: path
          required: true
          description: Primary key of the student
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StudentInput'
      responses:
        '200':
          description: Student updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Student'
        '400':
          description: Invalid request data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Student not found
    patch:
      summary: Partially update a student
      description: Partially updates an existing student record.
      operationId: partialUpdateStudent
      tags:
        - students
      parameters:
        - name: id
          in: path
          required: true
          description: Primary key of the student
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StudentInput'
      responses:
        '200':
          description: Student updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Student'
        '400':
          description: Invalid request data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Student not found
    delete:
      summary: Delete a student
      description: Deletes a student record by primary key.
      operationId: deleteStudent
      tags:
        - students
      parameters:
        - name: id
          in: path
          required: true
          description: Primary key of the student
          schema:
            type: integer
      responses:
        '204':
          description: Student deleted successfully
        '404':
          description: Student not found
components:
  schemas:
    Student:
      type: object
      properties:
        id:
          type: integer
          description: Unique primary key
          example: 1
        name:
          type: string
          maxLength: 120
          description: Student's full name
          example: John Doe
        reg_no:
          type: string
          maxLength: 20
          description: Registration number (unique)
          example: REG2024001
        phone:
          type: string
          maxLength: 20
          nullable: true
          description: Phone number
          example: '1234567890'
        email:
          type: string
          format: email
          nullable: true
          description: Email address
          example: john@example.com
        portfolio_link:
          type: string
          format: uri
          nullable: true
          description: Portfolio or website URL
          example: https://johndoe.com
      required:
        - name
        - reg_no
    StudentInput:
      type: object
      properties:
        name:
          type: string
          maxLength: 120
          description: Student's full name
        reg_no:
          type: string
          maxLength: 20
          description: Registration number (unique)
        phone:
          type: string
          maxLength: 20
          nullable: true
          description: Phone number
        email:
          type: string
          format: email
          nullable: true
          description: Email address
        portfolio_link:
          type: string
          format: uri
          nullable: true
          description: Portfolio or website URL
      required:
        - name
        - reg_no
    ErrorResponse:
      type: object
      properties:
        field:
          type: array
          items:
            type: string
          description: Error messages for specific fields
      example:
        reg_no:
          - A student with this reg_no already exists.
